<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>joymne</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #0b0f19; 
      margin: 0; 
      padding: 20px; 
      color: #fff; 
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container { width: 100%; max-width: 400px; text-align: center; }
    
    .header-text { color: #8c9bae; font-size: 16px; margin-bottom: 25px; }

    /* Пирамидка кругов */
    .pyramid { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-bottom: 25px; }
    .row { display: flex; gap: 20px; justify-content: center; width: 100%; }

    /* Стили круглых кнопок */
    .circle-btn {
      width: 90px; height: 90px; border-radius: 50%;
      background: #161b22; border: 3px solid #30363d;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s; color: #fff; font-weight: bold;
    }
    .circle-btn span { font-size: 12px; color: #8b949e; margin-top: 4px; font-weight: normal; }

    /* Подсветка активных кругов */
    .circle-joy { border-color: rgba(242, 201, 76, 0.4); }
    .circle-joy.active { border-color: #f2c94c; background: rgba(242, 201, 76, 0.15); box-shadow: 0 0 20px rgba(242, 201, 76, 0.4); }

    .circle-debt { border-color: rgba(235, 87, 87, 0.4); }
    .circle-debt.active { border-color: #eb5757; background: rgba(235, 87, 87, 0.15); box-shadow: 0 0 20px rgba(235, 87, 87, 0.4); }

    .circle-transit { border-color: rgba(108, 117, 125, 0.4); }
    .circle-transit.active { border-color: #adb5bd; background: rgba(108, 117, 125, 0.2); box-shadow: 0 0 20px rgba(108, 117, 125, 0.4); }

    .circle-mila { border-color: rgba(187, 134, 252, 0.4); }
    .circle-mila.active { border-color: #bb86fc; background: rgba(187, 134, 252, 0.15); box-shadow: 0 0 20px rgba(187, 134, 252, 0.4); }

    .circle-bank { border-color: rgba(47, 128, 237, 0.4); }
    .circle-bank.active { border-color: #2f80ed; background: rgba(47, 128, 237, 0.15); box-shadow: 0 0 20px rgba(47, 128, 237, 0.4); }

    .circle-hands { border-color: rgba(39, 174, 96, 0.4); }
    .circle-hands.active { border-color: #27ae60; background: rgba(39, 174, 96, 0.15); box-shadow: 0 0 20px rgba(39, 174, 96, 0.4); }

    /* Зона карточки */
    .input-card { background: #161b22; padding: 20px; border-radius: 20px; border: 1px solid #30363d; }
    textarea { width: 100%; padding: 12px; border: 1px solid #30363d; background: #0d1117; color: #fff; border-radius: 12px; font-size: 16px; box-sizing: border-box; resize: none; margin-bottom: 15px; outline: none; text-align: center; }
    textarea::placeholder { color: #484f58; }

    /* Панель Joy: доходы слева, расходы справа в одну строку */
    #joySummaryPanel { display: none; padding: 5px 0 15px 0; }
    .summary-inline { display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: bold; padding: 0 10px; }
    .val-income { color: #238636; }
    .val-expense { color: #eb5757; }

    /* Интерфейс транзита */
    #transitPanel { display: none; margin-bottom: 15px; }
    .transit-circles-row { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 15px; }
    
    .transit-circle {
      width: 80px; height: 80px; border-radius: 50%;
      background: #0d1117; color: #fff; border: 3px solid #30363d;
      display: flex; align-items: center; justify-content: center;
    }
    
    .transit-circle select {
      background: transparent; color: #fff; border: none; font-size: 14px; font-weight: bold;
      width: 100%; text-align: center; text-align-last: center; outline: none; cursor: pointer;
      appearance: none; -webkit-appearance: none; -moz-appearance: none;
      padding: 0 5px;
    }
    .transit-circle select option { background: #161b22; color: #fff; }

    .circle-from-box { border-color: rgba(235, 87, 87, 0.6); }
    .circle-to-box { border-color: rgba(47, 128, 237, 0.6); }

    .transit-amount { width: 100%; padding: 12px; background: transparent; color: #fff; border: none; font-size: 16px; text-align: center; box-sizing: border-box; outline: none; }
    .transit-amount::placeholder { color: #484f58; }

    /* Кнопки сохранения */
    .actions { display: flex; gap: 10px; }
    button.submit-btn { flex: 2; background: #238636; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button.photo-btn { flex: 1; background: #30363d; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }

    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #21262d; color: #fff; padding: 10px 20px; border-radius: 20px; display: none; font-size: 14px; border: 1px solid #30363d; z-index: 1000; }

    /* --- СТИЛИ ДЛЯ ВСПЛЫВАЮЩЕГО ОКНА (МОДАЛКИ) --- */
    #modalOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; }
    .modal-content { background: #161b22; padding: 25px; border-radius: 20px; width: 90%; max-width: 340px; border: 1px solid #30363d; box-shadow: 0 10px 30px rgba(0,0,0,0.7); text-align: center; }
    .modal-content h3 { margin-top: 0; color: #8c9bae; margin-bottom: 20px; }
    #modalTypeBtn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 15px; cursor: pointer; transition: 0.2s; }
    .modal-field { margin-bottom: 15px; text-align: left; }
    .modal-field label { font-size: 12px; color: #8b949e; display: block; margin-bottom: 5px; padding-left: 5px; }
    .modal-field input, .modal-field select { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 18px; box-sizing: border-box; outline: none; appearance: none; -webkit-appearance: none; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-btn-cancel { flex: 1; background: #30363d; color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; }
    .modal-btn-confirm { flex: 2; background: #238636; color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-text">joymne</div>

  <!-- Пирамидка кругов -->
  <div class="pyramid">
    <div class="row">
      <div class="circle-btn circle-joy" id="btn-Joy" onclick="selectCategory('Joy')">
        Joy
        <span id="balJoy">---</span>
      </div>
    </div>
    <div class="row">
      <div class="circle-btn circle-debt" id="btn-Долги" onclick="selectCategory('Долги')">
        Долги
        <span id="balDebts">---</span>
      </div>
      <div class="circle-btn circle-transit" id="btn-Транзит" onclick="selectCategory('Транзит')">
        Транзит
        <span id="balTransit">---</span>
      </div>
    </div>
    <div class="row">
      <div class="circle-btn circle-mila" id="btn-Мила" onclick="selectCategory('Мила')">
        Мила
        <span id="balMila">---</span>
      </div>
      <div class="circle-btn circle-bank" id="btn-Банк" onclick="selectCategory('Банк')">
        Банк
        <span id="balBank">---</span>
      </div>
      <div class="circle-btn circle-hands active" id="btn-Руки" onclick="selectCategory('Руки')">
        Руки
        <span id="balHands">---</span>
      </div>
    </div>
  </div>

  <!-- Зона ввода -->
  <div class="input-card">
    
    <div id="standardInput">
      <textarea id="txInput" rows="2" placeholder="Сумма и описание..."></textarea>
    </div>

    <!-- Блок транзита: кружки ИЗ и В без лишнего текста -->
    <div id="transitPanel">
      <div class="transit-circles-row">
        <div class="transit-circle circle-from-box">
          <select id="walletFrom">
            <option value="Руки">Руки</option>
            <option value="Мила">Мила</option>
            <option value="Банк">Банк</option>
            <option value="Долги">Долги</option>
            <option value="Транзит">Транзит</option>
          </select>
        </div>
        <div style="font-size: 20px; color: #8b949e;">➔</div>
        <div class="transit-circle circle-to-box">
          <select id="walletTo">
            <option value="Транзит">Транзит</option>
            <option value="Руки">Руки</option>
            <option value="Мила">Мила</option>
            <option value="Банк">Банк</option>
            <option value="Долги">Долги</option>
          </select>
        </div>
      </div>
      <input type="text" id="transitAmount" class="transit-amount" placeholder="Сумма перевода (€)">
    </div>

    <!-- Панель Joy: доходы слева, расходы справа в одну строку -->
    <div id="joySummaryPanel">
      <div class="summary-inline">
        <span class="val-income" id="monthlyIncome">0.00 €</span>
        <span class="val-expense" id="monthlyExpense">0.00 €</span>
      </div>
    </div>

    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display: none;" onchange="handlePhoto(this)">

    <div class="actions" id="actionButtons">
      <button class="submit-btn" onclick="requestParseTransaction()">Сохранить</button>
      <button class="photo-btn" id="photoBtn" onclick="document.getElementById('photoInput').click()">📷 Чек</button>
    </div>
  </div>
</div>

<!-- ================= ВСПЛЫВАЮЩЕЕ ОКНО (МОДАЛКА) ================= -->
<div id="modalOverlay">
  <div class="modal-content">
    <h3>Проверка данных</h3>
    
    <button id="modalTypeBtn" onclick="toggleModalType()">Расход</button>
    
    <div class="modal-field">
      <label>Сумма (€):</label>
      <input type="number" id="modalAmount" step="0.01">
    </div>

    <div class="modal-field">
      <label>Вид транзакции:</label>
      <select id="modalCategory"></select>
    </div>

    <div class="modal-field">
      <label>Описание (или Фирма):</label>
      <input type="text" id="modalDescription">
    </div>

    <div class="modal-actions">
      <button class="modal-btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="modal-btn-confirm" onclick="confirmTransaction()">Подтвердить</button>
    </div>
  </div>
</div>

<div id="toast">Сохранение...</div>

<script>
  // === ВАЖНО: ВСТАВЬТЕ СЮДА ВАШ АКТУАЛЬНЫЙ URL ВЕБ-ПРИЛОЖЕНИЯ ===
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyouTYwZVPHbgb1jF7JoRmTIqW7novwK4hcwWCqlKDBq-4ExUp4gqx5deF5V0IiPJc7Dg/exec";
  
  let activeCategory = "Руки"; 
  let isSubmitting = false;
  let cachedBalances = {};
  
  // Глобальные переменные для модалки
  let globalCategories = [];
  let pendingTxData = {};
  let currentModalType = "expense";

  window.onload = function() {
    loadBalances();
    const savedMsg = sessionStorage.getItem("joymne_toast");
    if (savedMsg) {
      showToast(savedMsg);
      sessionStorage.removeItem("joymne_toast");
    }
  };

  function selectCategory(category) {
    // Повторное нажатие на Joy возвращает активную кассу "Руки" и сбрасывает балансы в прочерки
    if (activeCategory === "Joy" && category === "Joy") {
      activeCategory = "Руки";
      document.querySelectorAll('.circle-btn').forEach(btn => btn.classList.remove('active'));
      const handsBtn = document.getElementById("btn-Руки");
      if (handsBtn) handsBtn.classList.add('active');
      
      renderDashes();

      document.getElementById("standardInput").style.display = "block";
      document.getElementById("transitPanel").style.display = "none";
      document.getElementById("joySummaryPanel").style.display = "none";
      document.getElementById("actionButtons").style.display = "flex";
      return;
    }

    activeCategory = category;
    
    document.querySelectorAll('.circle-btn').forEach(btn => btn.classList.remove('active'));
    const activeBtn = document.getElementById("btn-" + category);
    if (activeBtn) activeBtn.classList.add('active');

    const standardInput = document.getElementById("standardInput");
    const transitPanel = document.getElementById("transitPanel");
    const joySummaryPanel = document.getElementById("joySummaryPanel");
    const actionButtons = document.getElementById("actionButtons");

    standardInput.style.display = "none";
    transitPanel.style.display = "none";
    joySummaryPanel.style.display = "none";
    actionButtons.style.display = "flex";

    if (category === "Joy") {
      joySummaryPanel.style.display = "block";
      actionButtons.style.display = "none"; 
      
      if (Object.keys(cachedBalances).length === 0) {
        loadBalances(true);
      } else {
        renderBalances(cachedBalances);
      }
    } else if (category === "Транзит") {
      transitPanel.style.display = "block";
      renderDashes();
    } else {
      standardInput.style.display = "block";
      renderDashes();
    }
  }

  function renderBalances(balances) {
    const mila = balances["Мила"] || 0;
    const bank = balances["Банк"] || 0;
    const hands = balances["Руки"] || 0;
    const debts = balances["Долги"] || 0;
    const transit = balances["Транзит"] || 0;

    document.getElementById("balMila").innerText = mila.toFixed(2) + " €";
    document.getElementById("balBank").innerText = bank.toFixed(2) + " €";
    document.getElementById("balHands").innerText = hands.toFixed(2) + " €";
    document.getElementById("balDebts").innerText = debts.toFixed(2) + " €";
    document.getElementById("balTransit").innerText = transit.toFixed(2) + " €";
    
    const total = mila + bank + hands + debts + transit;
    document.getElementById("balJoy").innerText = total.toFixed(2) + " €";
  }

  function renderDashes() {
    document.getElementById("balMila").innerText = "---";
    document.getElementById("balBank").innerText = "---";
    document.getElementById("balHands").innerText = "---";
    document.getElementById("balDebts").innerText = "---";
    document.getElementById("balTransit").innerText = "---";
    document.getElementById("balJoy").innerText = "---";
  }

  async function loadBalances(openJoyAfter = false) {
    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?action=getBalances`);
      const data = await res.json();
      if (data.status === "success") {
        cachedBalances = data.balances || {};
        document.getElementById("monthlyIncome").innerText = (data.monthlyIncome || 0).toFixed(2) + " €";
        document.getElementById("monthlyExpense").innerText = (data.monthlyExpense || 0).toFixed(2) + " €";
        
        if (data.categories) {
          globalCategories = data.categories; // Сохраняем виды расходов для модалки
        }

        if (openJoyAfter && activeCategory === "Joy") {
          renderBalances(cachedBalances);
        }
      }
    } catch (e) {
      console.error("Не удалось загрузить балансы", e);
    }
  }

  // --- ШАГ 1: ОТПРАВЛЯЕМ ДАННЫЕ НА АНАЛИЗ (ПО КНОПКЕ "СОХРАНИТЬ" ИЛИ ПОСЛЕ ФОТО) ---
  async function requestParseTransaction(photoBase64 = null) {
    if (isSubmitting || activeCategory === "Joy") return;

    let finalDescription = "";

    if (activeCategory === "Транзит") {
      const fromW = document.getElementById("walletFrom").value;
      const toW = document.getElementById("walletTo").value;
      const amountVal = document.getElementById("transitAmount").value.trim();
      if (!amountVal) { alert("Введите сумму перевода!"); return; }
      finalDescription = toW ? `Перевод из ${fromW} в ${toW} ${amountVal}` : `Перевод из ${fromW} в Копилка (Сбережения) ${amountVal}`;
    } else {
      finalDescription = document.getElementById("txInput").value.trim();
      if (!finalDescription && !photoBase64) { alert("Введите описание или сумму!"); return; }
    }

    isSubmitting = true;
    showToast(photoBase64 ? "Распознавание чека..." : "Анализ данных...");

    // Сохраняем исходные данные до подтверждения
    pendingTxData = { category: activeCategory, text: finalDescription, photo: photoBase64 };

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ actionType: "parse", category: activeCategory, text: finalDescription, photo: photoBase64 }),
        redirect: "follow"
      });

      const data = await response.json();
      isSubmitting = false;
      
      if (data.status === "success") {
        openModal(data.parsed); // Открываем окно предпросмотра!
      } else {
        alert("Ошибка: " + data.message);
      }
    } catch (err) {
      alert("Ошибка сети");
      isSubmitting = false;
    }
  }

  // --- ШАГ 2: ОТКРЫТИЕ И УПРАВЛЕНИЕ МОДАЛКОЙ ---
  function openModal(parsedData) {
    currentModalType = parsedData.type;
    
    document.getElementById("modalAmount").value = parsedData.amount;
    document.getElementById("modalDescription").value = parsedData.description;
    
    // Заполняем выпадающий список видов (Категорий)
    const selectCat = document.getElementById("modalCategory");
    selectCat.innerHTML = "";
    
    let cats = [...globalCategories];
    if (parsedData.view && !cats.includes(parsedData.view)) cats.push(parsedData.view);
    
    cats.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c;
      opt.innerText = c;
      if (c === parsedData.view) opt.selected = true;
      selectCat.appendChild(opt);
    });

    updateModalTypeBtn();
    document.getElementById("modalOverlay").style.display = "flex";
  }

  function updateModalTypeBtn() {
    const btn = document.getElementById("modalTypeBtn");
    if (pendingTxData.category === "Транзит") {
      btn.innerText = "Транзит (Перевод)";
      btn.style.background = "#2f80ed";
      btn.disabled = true; 
    } else {
      btn.disabled = false;
      if (currentModalType === "income") {
        btn.innerText = "Приход";
        btn.style.background = "#238636"; // Зеленый
      } else {
        btn.innerText = "Расход";
        btn.style.background = "#eb5757"; // Красный
      }
    }
  }

  function toggleModalType() {
    if (pendingTxData.category === "Транзит") return;
    currentModalType = currentModalType === "expense" ? "income" : "expense";
    updateModalTypeBtn();
  }

  function closeModal() {
    document.getElementById("modalOverlay").style.display = "none";
    document.getElementById("txInput").value = "";
    document.getElementById("transitAmount").value = "";
  }

  // --- ШАГ 3: ОКОНЧАТЕЛЬНОЕ ПОДТВЕРЖДЕНИЕ И ЗАПИСЬ ---
  async function confirmTransaction() {
    document.getElementById("modalOverlay").style.display = "none";
    showToast("Сохранение...");
    isSubmitting = true;

    const confirmedData = {
      type: pendingTxData.category === "Транзит" ? "transfer" : currentModalType,
      amount: parseFloat(document.getElementById("modalAmount").value),
      view: document.getElementById("modalCategory").value,
      description: document.getElementById("modalDescription").value
    };

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ 
          actionType: "save_confirmed", 
          category: pendingTxData.category, 
          text: pendingTxData.text, 
          photo: pendingTxData.photo,
          confirmed: confirmedData
        }),
        redirect: "follow"
      });

      const data = await response.json();
      if (data.status === "success") {
        sessionStorage.setItem("joymne_toast", "✓ Успешно сохранено!");
        window.location.replace(window.location.pathname + "?t=" + Date.now());
      } else {
        alert("Ошибка сервера: " + data.message);
        isSubmitting = false;
      }
    } catch (err) {
      alert("Ошибка сети при сохранении");
      isSubmitting = false;
    }
  }

  // --- СЖАТИЕ ФОТО ---
  function handlePhoto(input) {
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width, height = img.height;
          if (width > height) { if (width > 1200) { height *= 1200 / width; width = 1200; } } 
          else { if (height > 1200) { width *= 1200 / height; height = 1200; } }
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          
          requestParseTransaction(canvas.toDataURL('image/jpeg', 0.6)); 
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.innerText = msg;
    t.style.display = "block";
    setTimeout(() => { t.style.display = "none"; }, 3000);
  }
</script>

</body>
</html>
