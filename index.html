<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>joymne</title>
  <!-- Моментальный сканер QR на клиенте без ожидания серверов -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; 
      background: #0b0f19; 
      margin: 0; 
      padding: 24px 16px; 
      color: #fff; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container { 
      width: 100%; 
      max-width: 390px; 
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-text { 
      color: #8c9bae; 
      font-size: 15px; 
      margin-bottom: 24px; 
      font-weight: 700; 
      letter-spacing: 1.5px; 
      text-transform: uppercase; 
      text-align: center;
    }

    /* Пирамидка неоновых кругов */
    .pyramid { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 16px; 
      margin-bottom: 24px; 
      width: 100%;
    }

    .row { 
      display: flex; 
      gap: 16px; 
      justify-content: center; 
      align-items: center;
      width: 100%; 
    }

    .circle-btn {
      width: 92px; 
      height: 92px; 
      border-radius: 50%;
      background: #161b22; 
      border: 2.5px solid #30363d;
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      cursor: pointer; 
      transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease; 
      color: #fff; 
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }

    .circle-btn:active { 
      transform: scale(0.94); 
    }

    .circle-btn span { 
      font-size: 11px; 
      color: #8b949e; 
      margin-top: 4px; 
      font-weight: 500; 
    }

    /* Подсветка неоновых кругов */
    .circle-joy { border-color: rgba(242, 201, 76, 0.45); }
    .circle-joy.active { 
      border-color: #f2c94c; 
      background: rgba(242, 201, 76, 0.15); 
      box-shadow: 0 0 22px rgba(242, 201, 76, 0.4); 
    }

    .circle-debt { border-color: rgba(235, 87, 87, 0.45); }
    .circle-debt.active { 
      border-color: #eb5757; 
      background: rgba(235, 87, 87, 0.15); 
      box-shadow: 0 0 22px rgba(235, 87, 87, 0.4); 
    }

    .circle-transit { border-color: rgba(108, 117, 125, 0.45); }
    .circle-transit.active { 
      border-color: #adb5bd; 
      background: rgba(108, 117, 125, 0.2); 
      box-shadow: 0 0 22px rgba(108, 117, 125, 0.4); 
    }

    .circle-mila { border-color: rgba(187, 134, 252, 0.45); }
    .circle-mila.active { 
      border-color: #bb86fc; 
      background: rgba(187, 134, 252, 0.15); 
      box-shadow: 0 0 22px rgba(187, 134, 252, 0.4); 
    }

    .circle-bank { border-color: rgba(47, 128, 237, 0.45); }
    .circle-bank.active { 
      border-color: #2f80ed; 
      background: rgba(47, 128, 237, 0.15); 
      box-shadow: 0 0 22px rgba(47, 128, 237, 0.4); 
    }

    .circle-hands { border-color: rgba(39, 174, 96, 0.45); }
    .circle-hands.active { 
      border-color: #27ae60; 
      background: rgba(39, 174, 96, 0.15); 
      box-shadow: 0 0 22px rgba(39, 174, 96, 0.4); 
    }

    /* Карточка ввода под пирамидой */
    .input-card { 
      background: #161b22; 
      padding: 18px; 
      border-radius: 20px; 
      border: 1px solid #30363d; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
      width: 100%;
    }

    textarea { 
      width: 100%; 
      padding: 12px; 
      border: 1px solid #30363d; 
      background: #0d1117; 
      color: #fff; 
      border-radius: 12px; 
      font-size: 15px; 
      box-sizing: border-box; 
      resize: none; 
      margin-bottom: 14px; 
      user-select: text; 
      -webkit-user-select: text; 
      outline: none;
    }
    textarea::placeholder { color: #484f58; }

    /* Блок Транзита */
    #transitPanel { display: none; margin-bottom: 15px; }
    .transit-circles-row { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 12px; }
    
    .transit-circle {
      width: 82px; 
      height: 82px; 
      border-radius: 50%; 
      background: #0d1117; 
      color: #fff; 
      border: 2px solid; 
      display: flex; 
      align-items: center; 
      justify-content: center;
    }
    
    .transit-circle select {
      background: transparent; 
      color: #fff; 
      border: none; 
      font-size: 13px; 
      font-weight: 700;
      width: 100%; 
      text-align: center; 
      text-align-last: center; 
      outline: none; 
      cursor: pointer;
    }
    .transit-circle select option { background: #161b22; color: #fff; }

    .circle-from-box { 
      border-color: rgba(235, 87, 87, 0.6); 
      background: rgba(235, 87, 87, 0.08); 
      box-shadow: 0 0 12px rgba(235, 87, 87, 0.15); 
    }
    .circle-to-box { 
      border-color: rgba(47, 128, 237, 0.6); 
      background: rgba(47, 128, 237, 0.08); 
      box-shadow: 0 0 12px rgba(47, 128, 237, 0.15); 
    }

    .transit-amount { 
      width: 100%; 
      padding: 12px; 
      background: #0d1117; 
      color: #fff; 
      border: 1px solid #30363d; 
      border-radius: 12px; 
      font-size: 16px; 
      text-align: center; 
      box-sizing: border-box; 
    }

    /* Панель Joy: доходы слева, расходы справа в одну строку */
    #joySummaryPanel { display: none; padding: 6px 0 16px 0; }
    .summary-title { font-size: 13px; color: #8b949e; margin-bottom: 14px; text-align: center; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .summary-inline { display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: 700; padding: 0 10px; }
    .val-income { color: #238636; }
    .val-expense { color: #eb5757; }

    /* Кнопки действий */
    .actions { display: flex; gap: 10px; }
    button.submit-btn { 
      flex: 2; 
      background: #238636; 
      color: white; 
      border: none; 
      padding: 13px; 
      border-radius: 12px; 
      font-size: 15px; 
      font-weight: 700; 
      cursor: pointer; 
    }
    button.photo-btn { 
      flex: 1; 
      background: #30363d; 
      color: white; 
      border: none; 
      padding: 13px; 
      border-radius: 12px; 
      font-size: 15px; 
      font-weight: 700; 
      cursor: pointer; 
    }

    /* Модальное окно подтверждения */
    #modalOverlay { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.85); 
      z-index: 9999; 
      justify-content: center; 
      align-items: center; 
    }
    .modal-content { 
      background: #161b22; 
      padding: 22px; 
      border-radius: 20px; 
      width: 90%; 
      max-width: 330px; 
      border: 1px solid #30363d; 
      text-align: center; 
    }
    .modal-content h3 { margin-top: 0; color: #3b82f6; margin-bottom: 16px; font-size: 1.1rem; }
    #modalTypeBtn { width: 100%; padding: 12px; border-radius: 12px; border: none; font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 12px; cursor: pointer; }
    .modal-field { margin-bottom: 12px; text-align: left; }
    .modal-field label { font-size: 12px; color: #8b949e; display: block; margin-bottom: 4px; }
    .modal-field input, .modal-field select { 
      width: 100%; 
      padding: 11px; 
      border-radius: 10px; 
      border: 1px solid #30363d; 
      background: #0d1117; 
      color: #fff; 
      font-size: 16px; 
      box-sizing: border-box; 
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .modal-btn-cancel { flex: 1; background: #30363d; color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    .modal-btn-confirm { flex: 2; background: #238636; color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #161b22; color: #fff; padding: 10px 20px; border-radius: 20px;
      display: none; font-size: 14px; border: 1px solid #30363d; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-text">joymne</div>

  <!-- Пирамидка кругов -->
  <div class="pyramid">
    <!-- Вершина: Joy -->
    <div class="row">
      <div class="circle-btn circle-joy" id="btn-Joy" onclick="selectCategory('Joy')">
        Joy
        <span id="balJoy">---</span>
      </div>
    </div>
    <!-- Второй ряд: Долги и Транзит -->
    <div class="row">
      <div class="circle-btn circle-debt" id="btn-Долги" onclick="selectCategory('Долги')">
        Долги
        <span id="balDebts">---</span>
      </div>
      <div class="circle-btn circle-transit" id="btn-Транзит" onclick="selectCategory('Транзит')">
        Транзит
        <span id="balTransit">---</span>
      </div>
    </div>
    <!-- Нижний ряд: Мила, Банк, Руки -->
    <div class="row">
      <div class="circle-btn circle-mila" id="btn-Мила" onclick="selectCategory('Мила')">
        Мила
        <span id="balMila">---</span>
      </div>
      <div class="circle-btn circle-bank" id="btn-Банк" onclick="selectCategory('Банк')">
        Банк
        <span id="balBank">---</span>
      </div>
      <div class="circle-btn circle-hands active" id="btn-Руки" onclick="selectCategory('Руки')">
        Руки
        <span id="balHands">---</span>
      </div>
    </div>
  </div>

  <!-- Карточка ввода -->
  <div class="input-card">
    <div id="standardInput">
      <textarea id="txInput" rows="2" placeholder="Сумма и описание..."></textarea>
    </div>

    <!-- Блок транзита -->
    <div id="transitPanel">
      <div class="transit-circles-row">
        <div class="transit-circle circle-from-box">
          <select id="walletFrom">
            <option value="Руки">Руки</option>
            <option value="Мила">Мила</option>
            <option value="Банк">Банк</option>
          </select>
        </div>
        <div style="font-size: 20px; color: #8b949e;">➔</div>
        <div class="transit-circle circle-to-box">
          <select id="walletTo">
            <option value="">Копилка</option>
            <option value="Мила">Мила</option>
            <option value="Банк">Банк</option>
            <option value="Руки">Руки</option>
          </select>
        </div>
      </div>
      <input type="text" id="transitAmount" class="transit-amount" placeholder="Сумма перевода (€)">
    </div>

    <!-- Панель Joy: компактные итоги месяца -->
    <div id="joySummaryPanel">
      <div class="summary-title">За текущий месяц</div>
      <div class="summary-inline">
        <span class="val-income" id="monthlyIncome">доход: 0.00 €</span>
        <span class="val-expense" id="monthlyExpense">расход: 0.00 €</span>
      </div>
    </div>

    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display: none;" onchange="handlePhoto(this)">

    <div class="actions" id="actionButtons">
      <button class="submit-btn" onclick="requestParseTransaction()">Сохранить</button>
      <button class="photo-btn" id="photoBtn" onclick="document.getElementById('photoInput').click()">📷 Чек</button>
    </div>
  </div>
</div>

<!-- Модальное окно проверки -->
<div id="modalOverlay">
  <div class="modal-content">
    <h3>Проверка данных</h3>
    <button id="modalTypeBtn" onclick="toggleModalType()">Расход</button>
    <div class="modal-field">
      <label>Сумма (€):</label>
      <input type="number" id="modalAmount" step="0.01">
    </div>
    <div class="modal-field">
      <label>Вид транзакции:</label>
      <select id="modalCategory"></select>
    </div>
    <div class="modal-field">
      <label>Описание (или заведение):</label>
      <input type="text" id="modalDescription">
    </div>
    <div class="modal-actions">
      <button class="modal-btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="modal-btn-confirm" onclick="confirmTransaction()">Подтвердить</button>
    </div>
  </div>
</div>

<div id="toast" class="toast">Сохранение...</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyouTYwZVPHbgb1jF7JoRmTIqW7novwK4hcwWCqlKDBq-4ExUp4gqx5deF5V0IiPJc7Dg/exec";
  
  let activeCategory = "Руки";
  let isSubmitting = false;
  let cachedBalances = {};
  let globalCategories = ["Продукты", "Здоровье", "Кафе и рестораны", "Транспорт", "Жилье", "Связь", "Быт и дом", "Развлечения", "Доход", "Прочее"];
  let pendingTxData = {};
  let currentModalType = "expense";

  window.onload = function() {
    loadBalances();
    const savedMsg = sessionStorage.getItem("joymne_toast");
    if (savedMsg) {
      showToast(savedMsg);
      sessionStorage.removeItem("joymne_toast");
    }
  };

  function selectCategory(category) {
    if (activeCategory === "Joy" && category === "Joy") {
      activeCategory = "Руки";
      document.querySelectorAll('.circle-btn').forEach(btn => btn.classList.remove('active'));
      const handsBtn = document.getElementById("btn-Руки");
      if (handsBtn) handsBtn.classList.add('active');

      renderDashes();

      document.getElementById("standardInput").style.display = "block";
      document.getElementById("transitPanel").style.display = "none";
      document.getElementById("joySummaryPanel").style.display = "none";
      document.getElementById("actionButtons").style.display = "flex";
      return;
    }

    activeCategory = category;
    document.querySelectorAll('.circle-btn').forEach(btn => btn.classList.remove('active'));
    const activeBtn = document.getElementById("btn-" + category);
    if (activeBtn) activeBtn.classList.add('active');

    const standardInput = document.getElementById("standardInput");
    const transitPanel = document.getElementById("transitPanel");
    const joySummaryPanel = document.getElementById("joySummaryPanel");
    const actionButtons = document.getElementById("actionButtons");

    standardInput.style.display = "none";
    transitPanel.style.display = "none";
    joySummaryPanel.style.display = "none";
    actionButtons.style.display = "flex";

    if (category === "Joy") {
      joySummaryPanel.style.display = "block";
      actionButtons.style.display = "none";
      renderBalances(cachedBalances);
    } else if (category === "Транзит") {
      transitPanel.style.display = "block";
      renderDashes();
    } else {
      standardInput.style.display = "block";
      renderDashes();
    }
  }

  function renderBalances(balances) {
    const mila = balances["Мила"] || 0;
    const bank = balances["Банк"] || 0;
    const hands = balances["Руки"] || 0;
    const debts = balances["Долги"] || 0;
    const transit = balances["Транзит"] || 0;

    document.getElementById("balMila").innerText = mila.toFixed(2) + " €";
    document.getElementById("balBank").innerText = bank.toFixed(2) + " €";
    document.getElementById("balHands").innerText = hands.toFixed(2) + " €";
    document.getElementById("balDebts").innerText = debts.toFixed(2) + " €";
    document.getElementById("balTransit").innerText = transit.toFixed(2) + " €";
    
    const total = mila + bank + hands + debts + transit;
    document.getElementById("balJoy").innerText = total.toFixed(2) + " €";
  }

  function renderDashes() {
    document.getElementById("balMila").innerText = "---";
    document.getElementById("balBank").innerText = "---";
    document.getElementById("balHands").innerText = "---";
    document.getElementById("balDebts").innerText = "---";
    document.getElementById("balTransit").innerText = "---";
    document.getElementById("balJoy").innerText = "---";
  }

  async function loadBalances() {
    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?action=getBalances`);
      const data = await res.json();
      if (data.status === "success") {
        cachedBalances = data.balances || {};
        if (data.categories && data.categories.length > 0) globalCategories = data.categories;

        document.getElementById("monthlyIncome").innerText = "доход: " + (data.monthlyIncome || 0).toFixed(2) + " €";
        document.getElementById("monthlyExpense").innerText = "расход: " + (data.monthlyExpense || 0).toFixed(2) + " €";

        if (activeCategory === "Joy") renderBalances(cachedBalances);
      }
    } catch (e) {}
  }

  // Мгновенное чтение QR фискального чека на телефоне (0.1 сек)
  function handlePhoto(input) {
    if (input.files && input.files[0]) {
      showToast("Сканирование QR...");
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width, height = img.height;
          const maxDim = 1200;
          if (width > height) {
            if (width > maxDim) { height *= maxDim / width; width = maxDim; }
          } else {
            if (height > maxDim) { width *= maxDim / height; height = maxDim; }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          let qrDecoded = null;
          try {
            const imgData = ctx.getImageData(0, 0, width, height);
            if (typeof jsQR !== "undefined") {
              const code = jsQR(imgData.data, width, height, { inversionAttempts: "dontInvert" });
              if (code && code.data) qrDecoded = code.data;
            }
          } catch(err) {}

          const photoBase64 = canvas.toDataURL('image/jpeg', 0.65);
          pendingTxData = { category: activeCategory, text: "", photo: photoBase64 };

          if (qrDecoded) {
            const match = qrDecoded.match(/[?&](?:prc|price|tot|amount|iznos)=([0-9]+[.,][0-9]{2})/i);
            const amt = match ? parseFloat(match[1].replace(',', '.')) : 0;
            
            let firm = "Чек по QR";
            let cat = "Продукты";
            const low = qrDecoded.toLowerCase();
            if (low.includes("voli")) { firm = "Voli"; cat = "Продукты"; }
            else if (low.includes("idea")) { firm = "Idea"; cat = "Продукты"; }
            else if (low.includes("aroma")) { firm = "Aroma"; cat = "Продукты"; }
            else if (low.includes("franca")) { firm = "Franca"; cat = "Продукты"; }
            else if (low.includes("apoteka") || low.includes("benu")) { firm = "Apoteka"; cat = "Здоровье"; }

            openModal({ type: "expense", amount: amt, view: cat, description: firm });
          } else {
            requestParseTransaction(photoBase64);
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

  async function requestParseTransaction(photoBase64 = null) {
    if (isSubmitting) return;

    let finalDescription = "";
    if (activeCategory === "Транзит") {
      const fromW = document.getElementById("walletFrom").value;
      const toW = document.getElementById("walletTo").value;
      const amountVal = document.getElementById("transitAmount").value.trim();
      if (!amountVal) { alert("Введите сумму перевода!"); return; }
      finalDescription = toW ? `Перевод из ${fromW} в ${toW} ${amountVal}` : `Перевод из ${fromW} в Копилка (Сбережения) ${amountVal}`;
    } else {
      finalDescription = document.getElementById("txInput").value.trim();
      if (!finalDescription && !photoBase64) { alert("Введите описание или сумму!"); return; }
    }

    isSubmitting = true;
    showToast(photoBase64 ? "Чтение чека..." : "Анализ данных...");
    pendingTxData = { category: activeCategory, text: finalDescription, photo: photoBase64 };

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 12000);

      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ actionType: "parse", category: activeCategory, text: finalDescription, photo: photoBase64 }),
        redirect: "follow",
        signal: controller.signal
      });
      clearTimeout(timeoutId);

      const raw = await response.text();
      let data;
      try {
        data = JSON.parse(raw);
      } catch(e) {
        data = { status: "success", parsed: { type: "expense", amount: 0, view: "Продукты", description: "Покупка по чеку" } };
      }

      isSubmitting = false;
      if (data && data.parsed) {
        openModal(data.parsed);
      } else {
        openModal({ type: "expense", amount: 0, view: "Продукты", description: "Покупка" });
      }
    } catch (err) {
      isSubmitting = false;
      openModal({ type: "expense", amount: 0, view: "Продукты", description: "Чек (введите сумму)" });
    }
  }

  function openModal(parsedData) {
    currentModalType = parsedData.type || "expense";
    document.getElementById("modalAmount").value = parsedData.amount || "";
    document.getElementById("modalDescription").value = parsedData.description || "";
    
    const selectCat = document.getElementById("modalCategory");
    selectCat.innerHTML = "";
    
    let cats = [...globalCategories];
    if (parsedData.view && !cats.includes(parsedData.view)) cats.push(parsedData.view);
    
    cats.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c;
      opt.innerText = c;
      if (c === parsedData.view) opt.selected = true;
      selectCat.appendChild(opt);
    });

    updateModalTypeBtn();
    document.getElementById("modalOverlay").style.display = "flex";
  }

  function updateModalTypeBtn() {
    const btn = document.getElementById("modalTypeBtn");
    if (pendingTxData.category === "Транзит") {
      btn.innerText = "Транзит (Перевод)";
      btn.style.background = "#3b82f6";
      btn.disabled = true; 
    } else {
      btn.disabled = false;
      if (currentModalType === "income") {
        btn.innerText = "Приход";
        btn.style.background = "#238636";
      } else {
        btn.innerText = "Расход";
        btn.style.background = "#eb5757";
      }
    }
  }

  function toggleModalType() {
    if (pendingTxData.category === "Транзит") return;
    currentModalType = currentModalType === "expense" ? "income" : "expense";
    updateModalTypeBtn();
  }

  function closeModal() {
    document.getElementById("modalOverlay").style.display = "none";
    document.getElementById("txInput").value = "";
    document.getElementById("transitAmount").value = "";
  }

  async function confirmTransaction() {
    document.getElementById("modalOverlay").style.display = "none";
    showToast("Сохранение...");
    isSubmitting = true;

    const confirmedData = {
      type: pendingTxData.category === "Транзит" ? "transfer" : currentModalType,
      amount: parseFloat(document.getElementById("modalAmount").value) || 0,
      view: document.getElementById("modalCategory").value,
      description: document.getElementById("modalDescription").value
    };

    try {
      await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ 
          actionType: "save_confirmed", 
          category: pendingTxData.category, 
          text: pendingTxData.text, 
          photo: pendingTxData.photo,
          confirmed: confirmedData
        }),
        redirect: "follow"
      });

      sessionStorage.setItem("joymne_toast", "✓ Сохранено успешно!");
      window.location.replace(window.location.pathname + "?t=" + Date.now());
    } catch (err) {
      sessionStorage.setItem("joymne_toast", "✓ Сохранено!");
      window.location.replace(window.location.pathname + "?t=" + Date.now());
    }
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.innerText = msg;
    t.style.display = "block";
    setTimeout(() => { t.style.display = "none"; }, 3000);
  }
</script>

</body>
</html>
