<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Учет расходов Mila D.O.O.</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; margin: 0; padding: 20px; color: #e0e0e0; }
    .container { max-width: 420px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    h2 { text-align: center; margin-bottom: 20px; color: #4dabf7; }
    
    .balances-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
    .balance-card { background: #2c2c2c; padding: 12px; border-radius: 12px; border: 1px solid #333; text-align: center; }
    .balance-card span { display: block; font-size: 12px; color: #aaa; }
    .balance-card strong { font-size: 16px; color: #fff; }

    .categories { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 20px; }
    .cat-row { display: flex; gap: 10px; justify-content: center; width: 100%; }
    
    .cat-btn { 
      padding: 12px 24px; border: 2px solid #444; background: #2c2c2c; color: #e0e0e0;
      border-radius: 30px; cursor: pointer; font-weight: 600; font-size: 15px; transition: all 0.2s;
      flex: 1; max-width: 140px; text-align: center;
    }
    .cat-btn.active { background: #1a73e8; color: #fff; border-color: #1a73e8; box-shadow: 0 0 10px rgba(26,115,232,0.4); }

    #standardInputGroup { display: block; }
    textarea { width: 100%; padding: 14px; border: 1px solid #444; background: #2c2c2c; color: #fff; border-radius: 12px; font-size: 16px; box-sizing: border-box; resize: none; margin-bottom: 15px; }
    textarea::placeholder { color: #888; }

    #transitScreen { display: none; background: #252525; padding: 20px; border-radius: 16px; margin-bottom: 15px; border: 1px solid #444; text-align: center; }
    .transit-circles-container { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 15px; }
    
    .transit-circle-wrapper { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .transit-label { font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }

    .circle-from { 
      background: #d93838; color: white; width: 75px; height: 75px; border-radius: 50%; 
      display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 15px;
      border: none; outline: none; cursor: pointer; box-shadow: 0 4px 10px rgba(217,56,56,0.4);
      text-align: center;
    }
    .circle-to { 
      background: #1a73e8; color: white; width: 75px; height: 75px; border-radius: 50%; 
      display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 15px;
      border: none; outline: none; cursor: pointer; box-shadow: 0 4px 10px rgba(26,115,232,0.4);
      text-align: center;
    }

    .transit-amount-input { width: 100%; padding: 14px; border: 1px solid #555; background: #2c2c2c; color: #fff; border-radius: 12px; font-size: 18px; text-align: center; box-sizing: border-box; }
    .transit-amount-input::placeholder { color: #888; }

    .actions { display: flex; gap: 10px; }
    button.submit-btn { flex: 2; background: #2ea44f; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button.photo-btn { flex: 1; background: #484f58; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
    
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 20px; display: none; font-size: 14px; z-index: 1000; border: 1px solid #555; }
  </style>
</head>
<body>

<div class="container">
  <h2>Mila D.O.O. Учет</h2>

  <div class="balances-grid" id="balancesContainer">
    <div class="balance-card"><span>Мила</span><strong id="balMila">...</strong></div>
    <div class="balance-card"><span>Банк</span><strong id="balBank">...</strong></div>
    <div class="balance-card"><span>Руки</span><strong id="balHands">...</strong></div>
    <div class="balance-card"><span>Долги</span><strong id="balDebts">...</strong></div>
  </div>

  <div class="categories">
    <div class="cat-row">
      <button class="cat-btn" onclick="selectCategory('Мила')">Мила</button>
      <button class="cat-btn" onclick="selectCategory('Банк')">Банк</button>
    </div>
    <div class="cat-row">
      <button class="cat-btn active" onclick="selectCategory('Руки')">Руки</button>
      <button class="cat-btn" onclick="selectCategory('Долги')">Долги</button>
    </div>
    <div class="cat-row">
      <button class="cat-btn" onclick="selectCategory('Транзит')">Транзит</button>
    </div>
  </div>

  <div id="standardInputGroup">
    <textarea id="txInput" rows="2" placeholder="Например: 8 хлеб или получил 50..."></textarea>
  </div>

  <div id="transitScreen">
    <div class="transit-circles-container">
      <div class="transit-circle-wrapper">
        <span class="transit-label" style="color: #ff6b6b;">ИЗ</span>
        <select id="walletFrom" class="circle-from">
          <option value="Руки" style="background:#222; color:#fff;">Руки</option>
          <option value="Мила" style="background:#222; color:#fff;">Мила</option>
          <option value="Банк" style="background:#222; color:#fff;">Банк</option>
        </select>
      </div>
      <div style="font-size: 24px; color: #888; font-weight: bold;">➔</div>
      <div class="transit-circle-wrapper">
        <span class="transit-label" style="color: #4dabf7;">В</span>
        <select id="walletTo" class="circle-to">
          <option value="" style="background:#222; color:#fff;">Копилка</option>
          <option value="Мила" style="background:#222; color:#fff;">Мила</option>
          <option value="Банк" style="background:#222; color:#fff;">Банк</option>
          <option value="Руки" style="background:#222; color:#fff;">Руки</option>
        </select>
      </div>
    </div>
    <input type="text" id="transitAmount" class="transit-amount-input" placeholder="Сумма перевода (€)">
  </div>

  <input type="file" id="photoInput" accept="image/*" capture="environment" style="display: none;" onchange="handlePhoto(this)">

  <div class="actions" id="actionButtons">
    <button class="submit-btn" onclick="submitTransaction()">Сохранить</button>
    <button class="photo-btn" id="photoBtn" onclick="document.getElementById('photoInput').click()">📷 Чек</button>
  </div>
</div>

<div id="toast">Сохранение...</div>

<script>
  // === ВАЖНО: ВСТАВЬТЕ СЮДА ВАШ АКТУАЛЬНЫЙ URL ===
  const APPS_SCRIPT_URL = "ВАШ_WEB_APP_URL_ЗДЕСЬ";
  
  let activeCategory = "Руки"; // По умолчанию выбрана касса "Руки"
  let isSubmitting = false;

  window.onload = function() {
    loadBalances();
    const savedMsg = sessionStorage.getItem("joymne_toast");
    if (savedMsg) {
      showToast(savedMsg);
      sessionStorage.removeItem("joymne_toast");
    }
  };

  function selectCategory(category) {
    activeCategory = category;
    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.classList.toggle('active', btn.innerText === category);
    });

    const standardInput = document.getElementById("standardInputGroup");
    const transitScreen = document.getElementById("transitScreen");
    const photoBtn = document.getElementById("photoBtn");

    if (category === "Транзит") {
      standardInput.style.display = "none";
      transitScreen.style.display = "block";
      photoBtn.style.display = "none"; 
    } else {
      standardInput.style.display = "block";
      transitScreen.style.display = "none";
      photoBtn.style.display = "block"; 
    }
  }

  async function loadBalances() {
    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?action=getBalances`);
      const data = await res.json();
      if (data.status === "success") {
        document.getElementById("balMila").innerText = (data.balances["Мила"] || 0).toFixed(2) + " €";
        document.getElementById("balBank").innerText = (data.balances["Банк"] || 0).toFixed(2) + " €";
        document.getElementById("balHands").innerText = (data.balances["Руки"] || 0).toFixed(2) + " €";
        document.getElementById("balDebts").innerText = (data.balances["Долги"] || 0).toFixed(2) + " €";
      }
    } catch (e) {
      console.error("Не удалось загрузить балансы", e);
    }
  }

  async function submitTransaction(photoBase64 = null) {
    if (isSubmitting) {
      showToast("⏳ Предыдущая транзакция еще обрабатывается...");
      return;
    }

    let finalDescription = "";

    if (activeCategory === "Транзит") {
      const fromWallet = document.getElementById("walletFrom").value;
      const toWallet = document.getElementById("walletTo").value;
      const amountVal = document.getElementById("transitAmount").value.trim();

      if (!amountVal) {
        alert("Введите сумму перевода!");
        return;
      }
      finalDescription = toWallet 
        ? `Перевод из ${fromWallet} в ${toWallet} ${amountVal}` 
        : `Перевод из ${fromWallet} в Копилка (Сбережения) ${amountVal}`;
    } else {
      finalDescription = document.getElementById("txInput").value.trim();
      if (!finalDescription && !photoBase64) {
        alert("Введите описание или прикрепите чек!");
        return;
      }
    }

    isSubmitting = true;
    showToast("Отправка и распознавание...");

    // Очищаем форму для следующего ввода сразу
    document.getElementById("txInput").value = "";
    document.getElementById("transitAmount").value = "";

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ category: activeCategory, text: finalDescription, photo: photoBase64 }),
        redirect: "follow"
      });

      const data = await response.json();
      if (data.status === "success") {
        showToast("✓ Успешно сохранено!");
        loadBalances();
      } else {
        alert("Ошибка сервера: " + (data.message || "Неизвестная ошибка"));
      }
    } catch (err) {
      alert("Ошибка соединения с таблицей");
    } finally {
      isSubmitting = false;
    }
  }

  // === АВТОМАТИЧЕСКОЕ СЖАТИЕ ФОТО ДЛЯ УСКОРЕНИЯ И ИЗБЕЖАНИЯ ОШИБОК ===
  function handlePhoto(input) {
    if (input.files && input.files[0]) {
      const file = input.files[0];
      const reader = new FileReader();
      
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 1200;
          const MAX_HEIGHT = 1200;
          let width = img.width;
          let height = img.height;

          // Масштабирование
          if (width > height) {
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
          } else {
            if (height > MAX_HEIGHT) {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // Сжатие до JPEG 60% качества
          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.6);
          submitTransaction(compressedDataUrl); // Отправляем легкий файл!
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  }

  function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.innerText = msg;
    toast.style.display = "block";
    setTimeout(() => { toast.style.display = "none"; }, 3500);
  }
</script>

</body>
</html>
